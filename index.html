<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Validades</title>
<style>
  :root {
    --bg: #f4f6f5; --card: #fff; --txt: #1c2321; --mut: #66726e;
    --pri: #0f766e; --warn: #b45309; --warnbg: #fef3c7;
    --bad: #b91c1c; --badbg: #fee2e2; --ok: #166534; --okbg: #dcfce7; --line: #e2e8e5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121715; --card: #1b2220; --txt: #e8eeeb; --mut: #93a29d;
      --warnbg: #3b2a0b; --badbg: #3f1515; --okbg: #12301c; --line: #2a3431; --warn: #fbbf24; --bad: #f87171; --ok: #4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt);
    font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom); }
  header { position: sticky; top: 0; z-index: 5; background: var(--pri); color: #fff;
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px; display: flex; align-items: center; gap: 8px; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  header button { background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 8px;
    padding: 8px 12px; font-size: 14px; }
  main { max-width: 640px; margin: 0 auto; padding: 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--mut); margin: 18px 4px 8px; }
  .banner { background: var(--warnbg); color: var(--warn); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-weight: 600; }
  .msg { color: var(--mut); text-align: center; padding: 24px 8px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
  .item .info { flex: 1; min-width: 0; }
  .item .nome { font-weight: 600; overflow-wrap: anywhere; }
  .item .det { color: var(--mut); font-size: 14px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 99px; padding: 2px 8px; margin-top: 4px; }
  .tag.bad { background: var(--badbg); color: var(--bad); }
  .tag.warn { background: var(--warnbg); color: var(--warn); }
  .tag.ok { background: var(--okbg); color: var(--ok); }
  .item.alerta { border-left: 5px solid var(--warn); }
  .item.vencido { border-left: 5px solid var(--bad); }
  .btn { background: var(--pri); color: #fff; border: 0; border-radius: 10px; padding: 10px 14px;
    font-size: 15px; font-weight: 600; white-space: nowrap; }
  .btn.sec { background: transparent; color: var(--txt); border: 1px solid var(--line); }
  dialog { border: 0; border-radius: 16px; padding: 18px; width: min(92vw, 420px);
    background: var(--card); color: var(--txt); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h3 { margin: 0 0 12px; }
  label { display: block; font-size: 14px; color: var(--mut); margin: 10px 0 4px; }
  input { width: 100%; padding: 11px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--txt); font-size: 16px; }
  .acoes { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .erro { color: var(--bad); font-size: 14px; margin-top: 8px; min-height: 18px; }
  .rodape { color: var(--mut); font-size: 12px; text-align: center; margin: 18px 0; }
</style>
</head>
<body>
<header>
  <h1>Validades</h1>
  <button id="btnPush" hidden>🔔 Ativar avisos</button>
  <button id="btnAdd">+ Produto</button>
  <button id="btnAtualizar" aria-label="Atualizar">↻</button>
  <button id="btnCfg" aria-label="Configurações">⚙</button>
</header>

<main>
  <div id="lista"></div>
  <p class="rodape" id="rodape"></p>
</main>

<!-- Diálogo: Já comprei / Adicionar -->
<dialog id="dlgItem">
  <form method="dialog" id="frmItem">
    <h3 id="tituloItem">Já comprei</h3>
    <div id="boxNome" hidden>
      <label for="fNome">Produto</label>
      <input id="fNome" autocomplete="off">
    </div>
    <label for="fQtd">Quantidade</label>
    <input id="fQtd" type="number" min="0" step="1" inputmode="numeric" required>
    <label for="fVal">Nova validade</label>
    <input id="fVal" type="date" required>
    <div class="erro" id="erroItem"></div>
    <div class="acoes">
      <button type="button" class="btn sec" id="cancelItem">Cancelar</button>
      <button type="submit" class="btn" id="salvarItem">Salvar</button>
    </div>
  </form>
</dialog>

<!-- Diálogo: configurações -->
<dialog id="dlgCfg">
  <form method="dialog" id="frmCfg">
    <h3>Configuração</h3>
    <label for="cUrl">URL do Apps Script (Web App)</label>
    <input id="cUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" required>
    <label for="cSenha">Senha</label>
    <input id="cSenha" type="password" required>
    <div class="erro" id="erroCfg"></div>
    <div class="acoes">
      <button type="button" class="btn sec" id="cancelCfg">Fechar</button>
      <button type="submit" class="btn">Salvar</button>
    </div>
  </form>
</dialog>

<script>
const LS = { url: 'val_url', senha: 'val_senha', cache: 'val_cache', hora: 'val_hora' };
const $ = (s) => document.querySelector(s);
let itens = [];
let diasAviso = 30;
let modo = 'comprar';   // 'comprar' | 'adicionar'
let linhaAtual = null;

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const br = (iso) => (/^\d{4}-\d{2}-\d{2}$/.test(iso) ? iso.split('-').reverse().join('/') : iso);
const cfg = () => ({ url: localStorage.getItem(LS.url), senha: localStorage.getItem(LS.senha) });

async function api(action, dados) {
  const { url, senha } = cfg();
  let r;
  if (!dados) {
    r = await fetch(url + '?action=' + action + '&senha=' + encodeURIComponent(senha));
  } else {
    r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action, senha }, dados))
    });
  }
  const j = await r.json();
  if (!j.ok) throw new Error(j.erro || 'Erro desconhecido');
  return j;
}

function diasHoje(iso) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return null;
  const [a, m, d] = iso.split('-').map(Number);
  const h = new Date(); h.setHours(0, 0, 0, 0);
  return Math.round((new Date(a, m - 1, d) - h) / 86400000);
}

function render() {
  const lista = $('#lista');
  if (!cfg().url) {
    lista.innerHTML = '<p class="msg">Toque em ⚙ para configurar a URL e a senha.</p>';
    return;
  }
  // recalcula dias no celular para nunca ficar desatualizado
  const comDias = itens.map((i) => Object.assign({}, i, { dias: diasHoje(i.validade) }));
  const alertas = comDias.filter((i) => i.dias !== null && i.dias <= diasAviso).sort((a, b) => a.dias - b.dias);
  const emDia = comDias.filter((i) => i.dias === null || i.dias > diasAviso).sort((a, b) => (a.dias ?? 1e9) - (b.dias ?? 1e9));

  let html = '';
  if (alertas.length) {
    html += '<div class="banner">⚠ ' + alertas.length + ' item(ns) para repor</div>';
    html += '<h2>Precisam de atenção</h2>' + alertas.map(card).join('');
  }
  html += '<h2>Em dia</h2>' + (emDia.length ? emDia.map(card).join('') : '<p class="msg">Nenhum item aqui.</p>');
  if (!itens.length) html = '<p class="msg">Nenhum produto na planilha ainda.</p>';
  lista.innerHTML = html;

  try { if (navigator.setAppBadge) alertas.length ? navigator.setAppBadge(alertas.length) : navigator.clearAppBadge(); } catch (e) {}
  const hora = localStorage.getItem(LS.hora);
  $('#rodape').textContent = hora ? 'Atualizado em ' + hora : '';
}

function card(i) {
  let cls = '', tag = '';
  if (i.dias === null) tag = '<span class="tag warn">Data inválida</span>';
  else if (i.dias < 0) { cls = 'vencido'; tag = '<span class="tag bad">Vencido há ' + Math.abs(i.dias) + ' dia(s)</span>'; }
  else if (i.dias === 0) { cls = 'vencido'; tag = '<span class="tag bad">Vence hoje</span>'; }
  else if (i.dias <= diasAviso) { cls = 'alerta'; tag = '<span class="tag warn">Vence em ' + i.dias + ' dia(s)</span>'; }
  else tag = '<span class="tag ok">' + i.dias + ' dias</span>';
  const qtd = i.quantidade === '' ? '—' : i.quantidade;
  return '<div class="item ' + cls + '"><div class="info"><div class="nome">' + esc(i.produto) + '</div>' +
    '<div class="det">Validade: ' + br(i.validade) + ' · Qtd: ' + esc(qtd) + '</div>' + tag + '</div>' +
    '<button class="btn" data-row="' + i.row + '">Já comprei</button></div>';
}

async function carregar() {
  if (!cfg().url) { render(); return; }
  try {
    const j = await api('listar');
    itens = j.itens;
    diasAviso = j.diasAviso || 30;
    localStorage.setItem(LS.cache, JSON.stringify({ itens, diasAviso }));
    localStorage.setItem(LS.hora, new Date().toLocaleString('pt-BR'));
  } catch (e) {
    const c = localStorage.getItem(LS.cache);
    if (c) { const o = JSON.parse(c); itens = o.itens; diasAviso = o.diasAviso; }
    render();
    $('#lista').insertAdjacentHTML('afterbegin',
      '<div class="banner">Sem conexão ou erro: ' + esc(e.message) + '. Mostrando dados salvos.</div>');
    return;
  }
  render();
}

/* ---------- diálogo item ---------- */
function abrirItem(m, row) {
  modo = m; linhaAtual = row;
  $('#erroItem').textContent = '';
  $('#boxNome').hidden = m !== 'adicionar';
  $('#fNome').required = m === 'adicionar';
  $('#tituloItem').textContent = m === 'adicionar' ? 'Novo produto' : 'Já comprei';
  const it = itens.find((x) => x.row === row);
  if (m === 'comprar' && it) $('#tituloItem').textContent = 'Já comprei: ' + it.produto;
  $('#fNome').value = ''; $('#fQtd').value = ''; $('#fVal').value = '';
  $('#dlgItem').showModal();
}

$('#lista').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-row]');
  if (b) abrirItem('comprar', Number(b.dataset.row));
});
$('#btnAdd').onclick = () => (cfg().url ? abrirItem('adicionar') : $('#dlgCfg').showModal());
$('#btnAtualizar').onclick = carregar;
$('#cancelItem').onclick = () => $('#dlgItem').close();

$('#frmItem').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#salvarItem');
  btn.disabled = true; btn.textContent = 'Salvando...';
  $('#erroItem').textContent = '';
  try {
    const base = { quantidade: Number($('#fQtd').value), validade: $('#fVal').value };
    if (modo === 'comprar') await api('comprar', Object.assign({ row: linhaAtual }, base));
    else await api('adicionar', Object.assign({ produto: $('#fNome').value }, base));
    $('#dlgItem').close();
    await carregar();
  } catch (err) {
    $('#erroItem').textContent = err.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Salvar';
  }
});

/* ---------- diálogo config ---------- */
$('#btnCfg').onclick = () => {
  $('#cUrl').value = cfg().url || '';
  $('#cSenha').value = cfg().senha || '';
  $('#erroCfg').textContent = '';
  $('#dlgCfg').showModal();
};
$('#cancelCfg').onclick = () => $('#dlgCfg').close();
$('#frmCfg').addEventListener('submit', async (e) => {
  e.preventDefault();
  localStorage.setItem(LS.url, $('#cUrl').value.trim());
  localStorage.setItem(LS.senha, $('#cSenha').value);
  try {
    await api('listar');
    $('#dlgCfg').close();
    carregar();
  } catch (err) {
    $('#erroCfg').textContent = 'Não consegui conectar: ' + err.message;
  }
});

/* ---------- notificações push (OneSignal) ---------- */
// Cole aqui o App ID do OneSignal (não é segredo). Enquanto estiver com o texto
// de exemplo, o app funciona normalmente, só sem o botão de notificações.
const ONESIGNAL_APP_ID = 'ceed83b6-5966-442c-81b8-ea386b60e9e7';
const pushAtivo = !!ONESIGNAL_APP_ID && !ONESIGNAL_APP_ID.startsWith('COLE_');
// pasta onde o app está hospedado (ex.: /nome-do-repo/ no GitHub Pages)
const BASE = location.pathname.replace(/[^/]*$/, '');

function atualizarBotaoPush() {
  // só mostra o botão se o navegador suporta e a pessoa ainda não decidiu
  $('#btnPush').hidden = !(pushAtivo && 'Notification' in window && Notification.permission === 'default');
}

if (pushAtivo) {
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  window.OneSignalDeferred.push(async (OneSignal) => {
    await OneSignal.init({
      appId: ONESIGNAL_APP_ID,
      serviceWorkerPath: BASE.slice(1) + 'sw.js',
      serviceWorkerParam: { scope: BASE },
      notifyButton: { enable: false }
    });
    atualizarBotaoPush();
  });
  const s = document.createElement('script');
  s.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';
  s.defer = true;
  document.head.appendChild(s);
  $('#btnPush').onclick = () => {
    window.OneSignalDeferred.push(async (OneSignal) => {
      await OneSignal.Notifications.requestPermission();
      atualizarBotaoPush();
    });
  };
  atualizarBotaoPush();
} else if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

/* ---------- início ---------- */
document.addEventListener('visibilitychange', () => { if (!document.hidden) carregar(); });
if (!cfg().url) { render(); setTimeout(() => $('#dlgCfg').showModal(), 300); } else { carregar(); }
</script>
</body>
</html>
